<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Surat Samudra untuk Rara • cwtch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Coastal Sky Art Elements -->
  <div class="coastal-sky">
    <div class="sun-illustration"></div>
    <div class="seagull gull-1"></div>
    <div class="seagull gull-2"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="brand-badge">
      <span>🏖️</span>
      <span>Jimbaran, Bali</span>
    </div>

    <button id="audio-toggle-btn" class="audio-control-btn" title="Nyalakan / Matikan Suara">
      <span id="audio-icon">🔊</span>
      <span id="audio-text">Suara</span>
    </button>
  </header>

  <!-- Main Responsive Game Container -->
  <main class="main-wrapper">
    <div id="game-root"></div>
  </main>

  <!-- Bottom Animated Ocean Waves (Pure Vector Art) -->
  <footer class="ocean-waves-container">
    <!-- Back Wave -->
    <svg class="waves-svg back" viewBox="0 24 150 28" preserveAspectRatio="none">
      <defs>
        <path id="gentle-wave-back" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <use href="#gentle-wave-back" x="48" y="0" fill="#2d6a4f" opacity="0.4" />
      <use href="#gentle-wave-back" x="48" y="3" fill="#1b4965" opacity="0.6" />
    </svg>

    <!-- Front Wave -->
    <svg class="waves-svg" viewBox="0 24 150 28" preserveAspectRatio="none">
      <defs>
        <path id="gentle-wave-front" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <use href="#gentle-wave-front" x="48" y="2" fill="#52b788" opacity="0.5" />
      <use href="#gentle-wave-front" x="48" y="5" fill="#16425b" opacity="0.95" />
    </svg>
  </footer>

  <!-- Scripts -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
